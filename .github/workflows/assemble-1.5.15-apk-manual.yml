name: Assemble verified 1.5.15 apk
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pocket-1515-apk
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'ruoruo43/pocket-tavern-updates' && github.actor == 'ruoruo43'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reconstruct fixed verified asset and upload to prepared draft
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zipfile
          from pathlib import Path
          C={'kind': 'apk', 'repo': 'ruoruo43/pocket-tavern-updates', 'release': 421503042, 'tag': 'v1.5.15', 'baseAsset': 666505585, 'baseBytes': 191456442, 'baseSha': 'fd1ee4309bda10152b07336465c5205132560eb064ba2025f8ec275b9ab899f7', 'patchAsset': 668201803, 'patchSha': 'c770b83360709f7974b3251ef6d98d656754a90df520fc5376578dde0425ca37', 'output': 'pocket-tavern-1.5.15-arm64.apk', 'outputBytes': 191456442, 'outputSha': '28c61d44857faa8de5a8920958da156222bceada1c699d02b42f2a1a62b99e8b'}
          assert os.environ['GITHUB_REPOSITORY']==C['repo']
          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh','api',*args]))
          def verify_asset(asset):
              assert asset['name']==C['output'] and asset['size']==C['outputBytes']
              assert asset['state']=='uploaded' and asset['digest']=='sha256:'+C['outputSha']
          def main():
              release_path='repos/'+C['repo']+'/releases/'+str(C['release'])
              release=gh_json(release_path)
              assert release['id']==C['release'] and release['tag_name']==C['tag']
              existing=[a for a in release['assets'] if a['name']==C['output']]
              if existing:
                  assert len(existing)==1
                  verify_asset(existing[0]);print('Exact verified asset already uploaded.');return
              assert release['draft'] is True, 'Only this prepared draft is allowed'
              with tempfile.TemporaryDirectory(prefix='pocket-1515-') as directory:
                  work=Path(directory)
                  def download(asset_id,name):
                      file=work/name
                      with file.open('wb') as target:
                          subprocess.run(['gh','api','repos/'+C['repo']+'/releases/assets/'+str(asset_id),'-H','Accept: application/octet-stream'],check=True,stdout=target)
                      return file
                  base=download(C['baseAsset'],'base.bin').read_bytes()
                  patch=download(C['patchAsset'],'delta.zip')
                  assert len(base)==C['baseBytes'] and hashlib.sha256(base).hexdigest()==C['baseSha']
                  assert hashlib.sha256(patch.read_bytes()).hexdigest()==C['patchSha']
                  with zipfile.ZipFile(patch) as z:
                      assert set(z.namelist())=={'manifest.json','insert.bin'} and len(z.infolist())==2
                      assert all(x.file_size<20000000 for x in z.infolist())
                      manifest=json.loads(z.read('manifest.json'));insert=z.read('insert.bin')
                  assert manifest['format']=='pocket-binary-delta-v1'
                  assert manifest['baseBytes']==C['baseBytes'] and manifest['baseSha256']==C['baseSha']
                  assert manifest['resultName']==C['output'] and manifest['resultBytes']==C['outputBytes'] and manifest['resultSha256']==C['outputSha']
                  assert 0<len(manifest['operations'])<50000
                  target=work/C['output'];digest=hashlib.sha256();total=0
                  with target.open('wb') as stream:
                      for op,start,length in manifest['operations']:
                          assert op in {'copy','insert'} and type(start) is int and type(length) is int and start>=0 and length>0
                          data=base if op=='copy' else insert
                          assert start+length<=len(data) and total+length<=C['outputBytes']
                          part=data[start:start+length];stream.write(part);digest.update(part);total+=length
                  assert total==C['outputBytes'] and digest.hexdigest()==C['outputSha']
                  # No checkout, build, signing, shell expansion, extracted scripts or arbitrary uploads.
                  url='https://uploads.github.com/repos/'+C['repo']+'/releases/'+str(C['release'])+'/assets?name='+C['output']
                  receipt=gh_json('--method','POST',url,'-H','Content-Type: application/octet-stream','--input',str(target))
                  verify_asset(receipt)
                  remote=gh_json(release_path)
                  verify_asset(next(a for a in remote['assets'] if a['name']==C['output']))
                  print('Verified exact result:',C['output'],total,C['outputSha'])
          main()
          PY
