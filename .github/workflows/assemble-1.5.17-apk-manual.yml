name: Assemble verified 1.5.17 APK
'on':
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pocket-1517-apk
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'ruoruo43/pocket-tavern-updates' && github.actor == 'ruoruo43'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reconstruct verified APK and upload to prepared draft
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,tempfile,zipfile
          from pathlib import Path
          C={'repo': 'ruoruo43/pocket-tavern-updates', 'release': 426285877, 'tag': 'v1.5.17', 'baseAsset': 670718208, 'baseBytes': 191460538, 'baseSha': '6ce00ca90dcc4fdadfaf3b428cc949e9a8a1b45914843ca5d0f88bb7e598109e', 'patchName': 'pocket-tavern-1.5.17-apk-delta.zip', 'patchBytes': 22490925, 'patchSha': '719fcc1320d7b38291be890e475236763231e4f476ca96a8354511970be21df4', 'output': 'pocket-tavern-1.5.17-arm64.apk', 'outputBytes': 191792314, 'outputSha': '468d9d30435be8e5d9cc94568f030c0f7fec4665466a29465e9b874eb4222d7b'}
          assert os.environ['GITHUB_REPOSITORY']==C['repo']
          assert os.environ['GITHUB_ACTOR']=='ruoruo43'
          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh','api',*args]))
          def verify_output(asset):
              assert asset['name']==C['output'] and asset['size']==C['outputBytes']
              assert asset['state']=='uploaded' and asset['digest']=='sha256:'+C['outputSha']
          def main():
              release_path='repos/'+C['repo']+'/releases/'+str(C['release'])
              release=gh_json(release_path)
              assert release['id']==C['release'] and release['tag_name']==C['tag']
              existing=[a for a in release['assets'] if a['name']==C['output']]
              if existing:
                  assert len(existing)==1
                  verify_output(existing[0]);print('Exact verified APK already uploaded.');return
              assert release['draft'] is True, 'Only this prepared draft is allowed'
              patches=[a for a in release['assets'] if a['name']==C['patchName']]
              assert len(patches)==1
              patch_asset=patches[0]
              assert patch_asset['state']=='uploaded' and patch_asset['size']==C['patchBytes']
              assert patch_asset['digest']=='sha256:'+C['patchSha']
              assert patch_asset['id']!=C['baseAsset']
              with tempfile.TemporaryDirectory(prefix='pocket-1517-') as directory:
                  work=Path(directory)
                  def download(asset_id,name):
                      file=work/name
                      with file.open('wb') as target:
                          subprocess.run(['gh','api','repos/'+C['repo']+'/releases/assets/'+str(asset_id),'-H','Accept: application/octet-stream'],check=True,stdout=target)
                      return file
                  base=download(C['baseAsset'],'base.bin').read_bytes()
                  patch=download(patch_asset['id'],'delta.zip')
                  assert len(base)==C['baseBytes'] and hashlib.sha256(base).hexdigest()==C['baseSha']
                  assert len(patch.read_bytes())==C['patchBytes'] and hashlib.sha256(patch.read_bytes()).hexdigest()==C['patchSha']
                  with zipfile.ZipFile(patch) as z:
                      assert len(z.infolist())==2 and set(z.namelist())=={'manifest.json','insert.bin'}
                      assert z.getinfo('manifest.json').file_size<8000000 and z.getinfo('insert.bin').file_size<64000000
                      assert z.testzip() is None
                      manifest=json.loads(z.read('manifest.json'));insert=z.read('insert.bin')
                  assert manifest['format']=='pocket-binary-delta-v1'
                  assert manifest['baseBytes']==C['baseBytes'] and manifest['baseSha256']==C['baseSha']
                  assert manifest['resultName']==C['output'] and manifest['resultBytes']==C['outputBytes'] and manifest['resultSha256']==C['outputSha']
                  assert 0<len(manifest['operations'])<50000
                  target=work/C['output'];digest=hashlib.sha256();total=0
                  with target.open('wb') as stream:
                      for op,start,length in manifest['operations']:
                          assert op in {'copy','insert'} and type(start) is int and type(length) is int and start>=0 and length>0
                          data=base if op=='copy' else insert
                          assert start+length<=len(data) and total+length<=C['outputBytes']
                          part=data[start:start+length];stream.write(part);digest.update(part);total+=length
                  assert total==C['outputBytes'] and digest.hexdigest()==C['outputSha']
                  url='https://uploads.github.com/repos/'+C['repo']+'/releases/'+str(C['release'])+'/assets?name='+C['output']
                  receipt=gh_json('--method','POST',url,'-H','Content-Type: application/octet-stream','--input',str(target))
                  verify_output(receipt)
                  remote=gh_json(release_path)
                  verify_output(next(a for a in remote['assets'] if a['name']==C['output']))
                  # Delete only this generated temporary delta, after verifying the final APK.
                  subprocess.run(['gh','api','--method','DELETE','repos/'+C['repo']+'/releases/assets/'+str(patch_asset['id'])],check=True)
                  print('Verified exact APK:',C['output'],total,C['outputSha'])
          main()
          PY
