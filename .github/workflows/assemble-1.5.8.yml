name: Assemble verified 1.5.8 APK once
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pocket-158-apk-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.5.8-new-signer
    steps:
      - name: Reconstruct exact signed APK from public baseline and verified delta
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'pocket-tavern-1.5.8-transfer-delta.zip'
          curl --fail --location --retry 3 --output base.apk https://github.com/ruoruo43/pocket-tavern-updates/releases/download/v1.5.7/pocket-tavern-1.5.7-arm64.apk
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          base = Path('base.apk').read_bytes()
          patch = Path('pocket-tavern-1.5.8-transfer-delta.zip').read_bytes()
          assert hashlib.sha256(base).hexdigest() == '8353d29508b294a2bfbccbc2f1637f522f7d1ea201e2a8eac07ca76969e29f81'
          assert hashlib.sha256(patch).hexdigest() == '1db778f182221d69ad75223f995dd75dbffd4a95cd785f35e8efe56cfcf9733a'
          with zipfile.ZipFile('pocket-tavern-1.5.8-transfer-delta.zip') as archive:
              assert set(archive.namelist()) == {'recipe.json', 'literal.bin'}
              assert archive.testzip() is None
              recipe = json.loads(archive.read('recipe.json'))
              literal = archive.read('literal.bin')
          assert recipe['schema'] == 1 and recipe['targetBytes'] == 191431866
          assert recipe['baseSha256'] == hashlib.sha256(base).hexdigest()
          assert recipe['targetSha256'] == '8f6f7289688f59bb902b36402907d8c8fbd22e78d54565dbc515b71ea4d79647'
          target = Path('pocket-tavern-1.5.8-arm64.apk')
          total = 0
          with target.open('wb') as output:
              for kind, offset, length in recipe['segments']:
                  assert kind in {'copy', 'literal'}
                  source = base if kind == 'copy' else literal
                  assert type(offset) is int and type(length) is int
                  assert 0 <= offset <= len(source) and 0 <= length <= len(source) - offset
                  total += length
                  assert total <= 191431866
                  output.write(memoryview(source)[offset:offset + length])
          assert total == target.stat().st_size == 191431866
          assert hashlib.sha256(target.read_bytes()).hexdigest() == recipe['targetSha256']
          print('Reconstructed APK is byte-identical to the locally signed and verified APK.')
          PY
          gh release upload "$TAG" pocket-tavern-1.5.8-arm64.apk --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          python3 - <<'PY'
          import json
          release = json.load(open('release.json'))
          asset = next(a for a in release['assets'] if a['name'] == 'pocket-tavern-1.5.8-arm64.apk')
          assert asset['size'] == 191431866
          assert asset['digest'] == 'sha256:8f6f7289688f59bb902b36402907d8c8fbd22e78d54565dbc515b71ea4d79647'
          print('GitHub confirms complete APK SHA-256 and size.')
          PY
