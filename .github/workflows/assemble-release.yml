name: Assemble verified 1.5.7 delta
run-name: Reconstruct verified 1.5.7 release bytes

on:
  push:
    branches: [main]
    paths: [.github/workflows/assemble-release.yml]

permissions:
  contents: write

concurrency:
  group: reconstruct-fixed-1.5.7
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.repository == 'ruoruo43/pocket-tavern-updates' && 'v1.5.7' || 'v1.5.7-source' }}
      DELTA_NAME: ${{ github.repository == 'ruoruo43/pocket-tavern-updates' && 'delta-8353d295.zip' || 'delta-fcaa6282.zip' }}
      DELTA_SHA256: ${{ github.repository == 'ruoruo43/pocket-tavern-updates' && '91af77fc50a6dd3e7eda9b349f530a8782d17028621a071128d456bf35d1d804' || 'f264456f88148745f982b5e9c4d959f7840c17fb2494019aa1b77bc68e74d02d' }}
    steps:
      - name: Reconstruct and verify the original signed bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path
          repo=os.environ['GH_REPO'];tag=os.environ['RELEASE_TAG']
          name=os.environ['DELTA_NAME'];expected=os.environ['DELTA_SHA256']
          assert repo in {'ruoruo43/pocket-tavern-updates','ruoruo43/pocket-tavern'}
          public=repo.endswith('/pocket-tavern-updates')
          assert tag==('v1.5.7' if public else 'v1.5.7-source')
          assert re.fullmatch(r'delta-[a-f0-9]{8}\.zip',name)
          assert re.fullmatch(r'[a-f0-9]{64}',expected)
          stage=Path('verified-delta');stage.mkdir()
          def sha(data):return hashlib.sha256(data).hexdigest()
          def gh(*args):return subprocess.run(['gh',*args],check=True,capture_output=True,text=True).stdout
          release_id=json.loads(gh('release','view',tag,'--repo',repo,'--json','databaseId'))['databaseId']
          assert type(release_id) is int and release_id>0
          release=json.loads(gh('api',f'repos/{repo}/releases/{release_id}'))
          assert release['draft'] is True and release['tag_name']==tag
          gh('release','download',tag,'--repo',repo,'--pattern',name,'--dir',str(stage))
          delta=(stage/name).read_bytes()
          assert 0<len(delta)<=32*1024*1024 and sha(delta)==expected
          with zipfile.ZipFile(stage/name) as archive:
              assert sorted(archive.namelist())==['literal.bin','recipe.json']
              assert archive.getinfo('recipe.json').file_size<=8*1024*1024
              assert archive.getinfo('literal.bin').file_size<=32*1024*1024
              recipe=json.loads(archive.read('recipe.json'));literal=archive.read('literal.bin')
          assert recipe['schemaVersion']==1
          source=recipe['base'];output=recipe['output'];parts=recipe['parts']
          base_tag='v1.5.6' if public else 'v1.5.6-source'
          base_asset='pocket-tavern-1.5.6-arm64.apk' if public else 'pocket-tavern-source-1.5.6.zip'
          output_name='pocket-tavern-1.5.7-arm64.apk' if public else 'pocket-tavern-source-1.5.7.zip'
          assert source['repo']==repo and source['tag']==base_tag and source['asset']==base_asset
          assert output['name']==output_name
          for metadata in (source,output):
              assert type(metadata['bytes']) is int and 0<metadata['bytes']<=512*1024*1024
              assert re.fullmatch(r'[a-f0-9]{64}',metadata['sha256'])
          assert recipe['literal']['bytes']==len(literal) and recipe['literal']['sha256']==sha(literal)
          gh('release','download',base_tag,'--repo',repo,'--pattern',base_asset,'--dir',str(stage))
          base=(stage/base_asset).read_bytes()
          assert len(base)==source['bytes'] and sha(base)==source['sha256']
          assert 0<len(parts)<=100000
          final=stage/output_name;total=0;digest=hashlib.sha256()
          with final.open('xb') as target:
              for part in parts:
                  assert set(part) in ({'copy','bytes'},{'literal','bytes'})
                  kind='copy' if 'copy' in part else 'literal';data=base if kind=='copy' else literal
                  at=part[kind];size=part['bytes']
                  assert type(at) is int and at>=0 and type(size) is int and size>0
                  assert at+size<=len(data) and total+size<=output['bytes']
                  chunk=data[at:at+size];target.write(chunk);digest.update(chunk);total+=size
          assert total==output['bytes'] and digest.hexdigest()==output['sha256']
          existing=[asset for asset in release['assets'] if asset['name']==output_name]
          if existing:
              assert len(existing)==1 and existing[0]['state']=='uploaded'
              assert existing[0]['size']==total and existing[0]['digest']=='sha256:'+output['sha256']
          else:gh('release','upload',tag,str(final),'--repo',repo)
          release=json.loads(gh('api',f'repos/{repo}/releases/{release_id}'))
          asset=next(asset for asset in release['assets'] if asset['name']==output_name)
          assert release['draft'] is True and asset['state']=='uploaded'
          assert asset['size']==total and asset['digest']=='sha256:'+output['sha256']
          print('Verified exact original release bytes',output_name,total,output['sha256'])
          PY
