name: Assemble verified release
run-name: Assemble ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      manifest_name:
        description: Uploaded transfer manifest
        required: true
        type: string
      manifest_sha256:
        description: Independently verified manifest SHA256
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: assemble-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      MANIFEST_NAME: ${{ inputs.manifest_name }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Download, verify and assemble original bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          repo=os.environ['GH_REPO']; tag=os.environ['RELEASE_TAG']
          name=os.environ['MANIFEST_NAME']; expected=os.environ['MANIFEST_SHA256']
          assert repo in {'ruoruo43/pocket-tavern-updates','ruoruo43/pocket-tavern'}
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-source)?',tag)
          assert re.fullmatch(r'transfer-[a-f0-9]{8}\.manifest\.json',name)
          assert re.fullmatch(r'[a-f0-9]{64}',expected)
          stage=Path('verified-transfer'); stage.mkdir()
          def gh(*args):
              return subprocess.run(['gh',*args],check=True,capture_output=True,text=True).stdout
          def download(asset):
              gh('release','download',tag,'--repo',repo,'--pattern',asset,'--dir',str(stage))
              return stage/asset
          manifest=download(name).read_bytes()
          assert len(manifest)<=256*1024 and hashlib.sha256(manifest).hexdigest()==expected
          data=json.loads(manifest); assert data['schemaVersion']==1
          output=data['output']; parts=data['parts']; transfer=data['transferId']
          assert re.fullmatch(r'[a-f0-9]{8}',transfer)
          assert name=='transfer-'+transfer+'.manifest.json'
          version=tag.removeprefix('v').removesuffix('-source')
          if repo.endswith('/pocket-tavern-updates'):
              assert not tag.endswith('-source')
              assert output['name']=='pocket-tavern-'+version+'-arm64.apk'
          else:
              assert tag.endswith('-source')
              assert output['name']=='pocket-tavern-source-'+version+'.zip'
          assert type(output['bytes']) is int and 0<output['bytes']<=512*1024*1024
          assert re.fullmatch(r'[a-f0-9]{64}',output['sha256'])
          assert 0<len(parts)<=128 and data['partBytes']==4194304
          assert len({p['name'] for p in parts})==len(parts)
          total=0; digest=hashlib.sha256(); assembled=stage/output['name']
          with assembled.open('xb') as target:
              for index,part in enumerate(parts):
                  assert part['index']==index and part['name']==f'transfer-{transfer}.part{index:04d}'
                  assert type(part['bytes']) is int and 0<part['bytes']<=data['partBytes']
                  assert re.fullmatch(r'[a-f0-9]{64}',part['sha256'])
                  blob=download(part['name']).read_bytes()
                  assert len(blob)==part['bytes'] and hashlib.sha256(blob).hexdigest()==part['sha256']
                  target.write(blob); digest.update(blob); total+=len(blob)
                  print('Verified part',index,'bytes',len(blob),flush=True)
          assert total==output['bytes'] and digest.hexdigest()==output['sha256']
          release_id=json.loads(gh('release','view',tag,'--repo',repo,'--json','databaseId'))['databaseId']
          assert type(release_id) is int and release_id>0
          release=json.loads(gh('api',f'repos/{repo}/releases/{release_id}'))
          existing=[a for a in release['assets'] if a['name']==output['name']]
          if existing:
              assert len(existing)==1 and existing[0]['state']=='uploaded'
              assert existing[0]['size']==total and existing[0]['digest']=='sha256:'+output['sha256']
          else:
              gh('release','upload',tag,str(assembled),'--repo',repo)
          release=json.loads(gh('api',f'repos/{repo}/releases/{release_id}'))
          asset=next(a for a in release['assets'] if a['name']==output['name'])
          assert asset['state']=='uploaded' and asset['size']==total and asset['digest']=='sha256:'+output['sha256']
          print('Verified final release asset',output['name'],total,output['sha256'])
          PY
